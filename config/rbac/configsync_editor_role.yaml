# This rule is not used by the project kubernetes-config-reloader itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the config.infra.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-config-reloader
    app.kubernetes.io/managed-by: kustomize
  name: configsync-editor-role
rules:
- apiGroups:
  - config.infra.io
  resources:
  - configsyncs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.infra.io
  resources:
  - configsyncs/status
  verbs:
  - get
