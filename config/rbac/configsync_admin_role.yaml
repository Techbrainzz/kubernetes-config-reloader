# This rule is not used by the project kubernetes-config-reloader itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over config.infra.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-config-reloader
    app.kubernetes.io/managed-by: kustomize
  name: configsync-admin-role
rules:
- apiGroups:
  - config.infra.io
  resources:
  - configsyncs
  verbs:
  - '*'
- apiGroups:
  - config.infra.io
  resources:
  - configsyncs/status
  verbs:
  - get
